spring:
  application:
    name: goodquestion

  servlet:
    multipart:
      max-file-size: 25MB    # Whisper API 최대 허용 크기
      max-request-size: 26MB

  # ────────────────────────────────────────
  # DataSource (Railway PostgreSQL)
  # 환경변수로 주입: DB_URL, DB_USERNAME, DB_PASSWORD
  # ────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update          # 로컬/개발: update | 운영: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # HikariCP 커넥션 풀
  hikari:
    maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
    minimum-idle: ${HIKARI_MIN_IDLE:5}

  # ────────────────────────────────────────
  # OAuth2 소셜 로그인
  # 소셜 로그인 키 발급 후 환경변수에 추가할 것
  # ────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
          # TODO: 카카오 키 발급 후 아래 주석 해제 + OAuth2UserInfoFactory case "kakao" 주석 해제
          # kakao:
          #   client-id: ${KAKAO_CLIENT_ID}
          #   client-secret: ${KAKAO_CLIENT_SECRET}
          #   client-authentication-method: client_secret_post
          #   authorization-grant-type: authorization_code
          #   redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          #   scope:
          #     - profile_nickname
          #     - account_email
          #   client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          # kakao:
          #   authorization-uri: https://kauth.kakao.com/oauth/authorize
          #   token-uri: https://kauth.kakao.com/oauth/token
          #   user-info-uri: https://kapi.kakao.com/v2/user/me
          #   user-name-attribute: id

# ────────────────────────────────────────
# JWT 설정
# ────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET_KEY}                    # Base64 인코딩된 256bit 이상 비밀키
  access-expiration: ${JWT_EXPIRATION_TIME:3600000}          # 기본 1시간 (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_TIME:604800000}  # 기본 7일 (ms)

# ────────────────────────────────────────
# OAuth2 Redirect URIs
# ────────────────────────────────────────
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/login?error=true}

# ────────────────────────────────────────
# CORS
# ────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ────────────────────────────────────────
# 서버 포트 (Railway는 PORT 환경변수 사용)
# ────────────────────────────────────────
server:
  port: ${PORT:8080}

# ────────────────────────────────────────
# OpenAI
# ────────────────────────────────────────
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    analysis: gpt-4o-mini
    character: gpt-4o-mini
    stt: whisper-1
    tts: tts-1
    tts-voice: nova

# ────────────────────────────────────────
# 관리자 코드 (ADMIN_CODE 환경변수로 주입)
# ────────────────────────────────────────
admin:
  code: ${ADMIN_CODE:admin1234}
